<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#17141b" />
  <meta name="description" content="共创规则怪谈世界，或进入别人建立的档案，在连续场景中判断规则并承担蝴蝶效应结局。" />
  <title>第十三句｜共创与进入档案</title>
</head>
<body>
  <main id="app" class="game-root stage-landing">
    <div class="ambient-grid" aria-hidden="true"></div>
    <div class="ambient-orb orb-one" aria-hidden="true"></div>
    <div class="ambient-orb orb-two" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <header class="topbar">
      <button class="brand-button" id="brandButton" aria-label="返回档案馆首页">
        <span>十三</span>
        <div><strong>第十三句</strong><small>CREATE · ENTER · LEAVE A TRACE</small></div>
      </button>
      <div class="top-status">
        <span id="archiveStatus"></span>
        <span class="service-dot" id="serviceDot" title="服务状态"></span>
        <button class="sound" id="soundButton"><i></i><span>开启环境声</span></button>
      </div>
    </header>
    <div id="scene" class="main-frame" aria-live="polite"></div>
    <footer class="site-footer">
      <span>有人建立规则，有人走进去验证它。</span>
      <span id="footerStatus">两个模式共享同一座档案馆</span>
    </footer>
  </main>
  <script src="/mode-router.js?v=1"></script>
</body>
</html>
